<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Mayas</title>
<link rel="icon" type="image/png" href="assets/app_icon.png">
<link rel="apple-touch-icon" href="assets/app_icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#050409;
    --violet:#8B5CF6;
    --violet-bright:#B39DFF;
    --violet-deep:#4C2889;
    --violet-glow:rgba(139,92,246,0.35);
    --line:rgba(179,157,255,0.14);
    --line-strong:rgba(179,157,255,0.30);
    --text:#F5F3FA;
    --muted:#8D84A8;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  h1,.display{ font-family:'Bricolage Grotesque', sans-serif; }

  .screen{
    display:grid;
    grid-template-columns:1.35fr 1fr;
    height:100vh;
    width:100%;
  }

  /* LEFT — giant logo panel */
  .stage{
    position:relative;
    background:var(--panel);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border-right:1px solid var(--line);
  }
  .stage::before{
    content:"";
    position:absolute; inset:-20%;
    background:
      radial-gradient(circle at 32% 38%, var(--violet-glow), transparent 55%),
      radial-gradient(circle at 75% 70%, rgba(76,40,137,0.30), transparent 50%);
    animation:swell 10s ease-in-out infinite alternate;
  }
  @keyframes swell{ to{ transform:scale(1.12) translate(2%,-2%); } }
  .stage::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:64px 64px;
    opacity:.35;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 70%);
            mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 70%);
  }

  .glyph{
    position:relative; z-index:1;
    width:min(60vw, 460px); height:min(60vw, 460px);
    border-radius:26%;
    overflow:hidden;
    background:#000;
    box-shadow:
      0 0 0 1px var(--line-strong),
      0 60px 140px -40px var(--violet-glow),
      0 0 180px -30px var(--violet-glow);
    animation:breathe 5s ease-in-out infinite;
  }
  .glyph img{ width:100%; height:100%; object-fit:contain; padding:14%; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }

  .stage-code{
    position:absolute; z-index:0;
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:800;
    font-size:min(46vw, 620px);
    line-height:1;
    letter-spacing:-0.06em;
    color:transparent;
    -webkit-text-stroke:1px var(--line-strong);
    user-select:none;
    white-space:nowrap;
  }

  /* RIGHT — content panel */
  .panel{
    display:flex; align-items:center; justify-content:center;
    padding:48px;
    position:relative;
  }
  .panel-inner{ width:100%; max-width:380px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--violet-bright);
    border:1px solid var(--line-strong); border-radius:999px;
    padding:5px 13px; margin-bottom:26px;
  }
  .eyebrow .dot{ width:5px; height:5px; border-radius:50%; background:var(--violet-bright); }

  .panel h1{
    font-size:clamp(30px,4vw,40px); font-weight:800;
    letter-spacing:-0.02em; line-height:1.08;
    margin-bottom:16px;
  }
  .panel p.sub{
    color:var(--muted); font-size:15px; line-height:1.6;
    margin-bottom:34px;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:14px 20px; border-radius:999px;
    font-size:15px; font-weight:600;
    border:1px solid var(--line-strong);
    transition:all .25s var(--ease);
    margin-bottom:12px;
  }
  .btn-primary{ background:var(--text); color:#000; border-color:var(--text); }
  .btn-primary:hover{ background:var(--violet-bright); border-color:var(--violet-bright); transform:translateY(-2px); box-shadow:0 10px 28px -10px var(--violet-glow); }
  .btn-ghost{ color:var(--text); background:rgba(255,255,255,0.02); }
  .btn-ghost:hover{ border-color:var(--violet-bright); color:var(--violet-bright); }

  .divider{ display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--muted); font-size:12px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .foot-links{ font-size:13px; color:var(--muted); text-align:center; }
  .foot-links a{ color:var(--muted); text-decoration:underline; text-underline-offset:2px; }
  .foot-links a:hover{ color:var(--violet-bright); }

  .panel-logo{
    display:none;
    width:32px; height:32px; border-radius:9px; overflow:hidden;
    background:#000; box-shadow:0 0 0 1px var(--line-strong);
    margin-bottom:28px;
  }
  .panel-logo img{ width:100%; height:100%; object-fit:contain; padding:2px; }

  /* mobile */
  @media(max-width:860px){
    .screen{ grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:100vh; }
    body{ overflow-y:auto; }
    .stage{ height:38vh; min-height:260px; border-right:none; border-bottom:1px solid var(--line); }
    .glyph{ width:150px; height:150px; }
    .panel{ padding:40px 24px 56px; }
    .panel-logo{ display:flex; align-items:center; justify-content:center; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="stage">
    <div class="stage-code">404</div>
    <!-- glyph removed -->
  </div>

  <div class="panel">
    <div class="panel-inner">
      <div class="panel-logo"><img src="assets/app_icon.png" alt="Mayas"></div>
      <div class="eyebrow"><span class="dot"></span>Ошибка 404</div>
      <h1>Такой страницы<br>не существует</h1>
      <p class="sub">Ссылка устарела или адрес введён неправильно. Проверьте её ещё раз — или возвращайтесь на главную.</p>

      <a class="btn btn-primary" href="./">На главную</a>
      <a class="btn btn-ghost" href="https://github.com/dan1eIDT/Mayas/releases" target="_blank" rel="noopener">Скачать Mayas</a>

      <div class="divider">MAYAS</div>

      <p class="foot-links">
        <a href="https://github.com/dan1eIDT/Mayas" target="_blank" rel="noopener">GitHub</a> ·
        <a href="tos.html">Соглашение и конфиденциальность</a>
      </p>
    </div>
  </div>
</div>

</body>
</html>
